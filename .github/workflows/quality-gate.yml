name: Quality Gate

on:
  pull_request:
    paths:
      - backend/**
      - frontend/js/**
      - .github/workflows/quality-gate.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/js/**
      - .github/workflows/quality-gate.yml

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm run test:ci

      - name: Run dependency audit (high)
        run: npm audit --omit=dev --audit-level=high

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend script syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done
